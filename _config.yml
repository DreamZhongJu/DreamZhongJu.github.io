title: DreamZhongJu's Blog
subtitle: '记录学习、研究与构建的过程'
description: 'DreamZhongJu，苏州大学在读研究生，研究方向为机器翻译。记录学习笔记、研究思考与项目实践。'
keywords: 机器翻译, Machine Translation, Transformer, KG-RAG, LLM, Knowledge Graph, Python, Go
author: DreamZhongJu
language: zh-CN
timezone: Asia/Shanghai
url: https://dreamzhongju.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

theme: next
pagination_dir: page
per_page: 10
default_layout: post

highlight:
  enable: true
  line_number: true
  auto_detect: true
  tab_replace: '  '

index_generator:
  path: ''
  per_page: 10
  order_by: -date

archive_generator:
  per_page: 20
  yearly: true
  monthly: false

tag_generator:
  per_page: 20

category_generator:
  per_page: 20

# SEO: sitemap for search engines.
sitemap:
  path: sitemap.xml

# SEO: RSS feed (Atom), also enables feed link in the sidebar.
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true

# Local search index.
search:
  path: search.xml
  field: post
  format: html
  limit: 10000
