scheme: Pisces
darkmode: false

menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  series: /agent-series/ || fa fa-list
  tags: /tags/ || fa fa-tags
  archives: /archives/ || fa fa-archive

menu_settings:
  icons: true
  badges: false

sidebar:
  position: left
  display: always
  padding: 18
  offset: 12
width_dual_column: 240

# Comments: Utterances (GitHub issues based, no OAuth App needed).
comments:
  active: utterances
utterances:
  enable: true
  repo: DreamZhongJu/DreamZhongJu.github.io
  issue_term: pathname
  theme: github-light

# Analytics: Busuanzi free page-view counter.
busuanzi_count:
  enable: true
  total_visitors: true
  total_visitors_icon: fa fa-user
  total_views: true
  total_views_icon: fa fa-eye
  post_views: true
  post_views_icon: far fa-eye

# Local search (uses search.xml generated by hexo-generator-searchdb).
local_search:
  enable: true
  top_n_per_article: 1
  unescape: false
  preload: true

avatar:
  url: https://avatars.githubusercontent.com/u/112360879?v=4
  rounded: true
  rotated: false

site_state: true

social:
  GitHub: https://github.com/DreamZhongJu || fab fa-github
  RSS: /atom.xml || fa fa-rss

social_icons:
  enable: true
  icons_only: false
  transition: false

links_settings:
  icon: fa fa-globe
  layout: block

footer:
  since: 2026
  icon:
    name: fa fa-heart
    animated: false
    color: '#555'
  powered: true

creative_commons:
  license: by-nc-sa
  sidebar: false
  post: false

post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
  categories: true

excerpt_description: true
read_more_btn: true

custom_file_path:
  style: source/_data/styles.styl
  head: source/_data/head.njk

# SEO: title with subtitle on the index page (e.g. "Blog - Subtitle").
index_with_subtitle: true

# SEO: site verification codes.
# Google Search Console: https://search.google.com/search-console
google_site_verification:
# Bing Webmaster: https://www.bing.com/webmasters
bing_site_verification:
# Baidu Webmaster: https://ziyuan.baidu.com/site
baidu_site_verification:
# Yandex Webmaster: https://webmaster.yandex.ru
yandex_site_verification:

# Self-host third-party scripts instead of loading from CDNJS.
# CDNJS (cdnjs.cloudflare.com) is often unreachable from mainland China,
# which silently breaks the local search popup (LocalSearch class missing).
vendors:
  local_search: /js/searchdb.js
  fontawesome: /lib/fontawesome/css/all.min.css
  animate_css: /lib/animate/animate.min.css
